<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 406" width="720" height="406" role="img" aria-label="解码策略示意：greedy、top-k、top-p" font-family="PingFang SC, 'Noto Sans SC', 'Noto Sans CJK SC', Inter, system-ui, sans-serif">
<title>解码策略示意：greedy、top-k、top-p</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#71717a"/></marker>
<marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f5574"/></marker></defs>
<rect width="720" height="406" fill="#ffffff"/>
<text x="24" y="30" font-size="15" fill="#18181b" text-anchor="start" font-weight="600" font-family="'SF Mono', Menlo, Consolas, monospace">The class was about ___</text><text x="24" y="50" font-size="11.5" fill="#71717a" text-anchor="start" font-weight="400">下一个 token 的概率（课件示例，只列出前 10 个）</text><text x="158" y="87" font-size="13" fill="#18181b" text-anchor="end" font-weight="400" font-family="'SF Mono', Menlo, Consolas, monospace">to</text><rect x="170" y="76" width="348.8" height="14" rx="2" fill="#2f5574"/><text x="526.81" y="87" font-size="11.5" fill="#71717a" text-anchor="start" font-weight="400" font-family="'SF Mono', Menlo, Consolas, monospace">0.3171</text><text x="158" y="111" font-size="13" fill="#18181b" text-anchor="end" font-weight="400" font-family="'SF Mono', Menlo, Consolas, monospace">as</text><rect x="170" y="100" width="54.0" height="14" rx="2" fill="#9fb3c4"/><text x="232.01" y="111" font-size="11.5" fill="#71717a" text-anchor="start" font-weight="400" font-family="'SF Mono', Menlo, Consolas, monospace">0.0491</text><text x="158" y="135" font-size="13" fill="#18181b" text-anchor="end" font-weight="400" font-family="'SF Mono', Menlo, Consolas, monospace">the</text><rect x="170" y="124" width="39.6" height="14" rx="2" fill="#9fb3c4"/><text x="217.6" y="135" font-size="11.5" fill="#71717a" text-anchor="start" font-weight="400" font-family="'SF Mono', Menlo, Consolas, monospace">0.0360</text><text x="158" y="159" font-size="13" fill="#18181b" text-anchor="end" font-weight="400" font-family="'SF Mono', Menlo, Consolas, monospace">a</text><rect x="170" y="148" width="36.3" height="14" rx="2" fill="#c3d0db"/><text x="214.3" y="159" font-size="11.5" fill="#71717a" text-anchor="start" font-weight="400" font-family="'SF Mono', Menlo, Consolas, monospace">0.0330</text><text x="158" y="183" font-size="13" fill="#18181b" text-anchor="end" font-weight="400" font-family="'SF Mono', Menlo, Consolas, monospace">two</text><rect x="170" y="172" width="16.2" height="14" rx="2" fill="#c3d0db"/><text x="194.17" y="183" font-size="11.5" fill="#71717a" text-anchor="start" font-weight="400" font-family="'SF Mono', Menlo, Consolas, monospace">0.0147</text><text x="158" y="207" font-size="13" fill="#18181b" text-anchor="end" font-weight="400" font-family="'SF Mono', Menlo, Consolas, monospace">how</text><rect x="170" y="196" width="13.6" height="14" rx="2" fill="#e3e9ee"/><text x="191.64" y="207" font-size="11.5" fill="#71717a" text-anchor="start" font-weight="400" font-family="'SF Mono', Menlo, Consolas, monospace">0.0124</text><text x="158" y="231" font-size="13" fill="#18181b" text-anchor="end" font-weight="400" font-family="'SF Mono', Menlo, Consolas, monospace">getting</text><rect x="170" y="220" width="11.1" height="14" rx="2" fill="#e3e9ee"/><text x="189.11" y="231" font-size="11.5" fill="#71717a" text-anchor="start" font-weight="400" font-family="'SF Mono', Menlo, Consolas, monospace">0.0101</text><text x="158" y="255" font-size="13" fill="#18181b" text-anchor="end" font-weight="400" font-family="'SF Mono', Menlo, Consolas, monospace">three</text><rect x="170" y="244" width="11.0" height="14" rx="2" fill="#e3e9ee"/><text x="189.0" y="255" font-size="11.5" fill="#71717a" text-anchor="start" font-weight="400" font-family="'SF Mono', Menlo, Consolas, monospace">0.0100</text><text x="158" y="279" font-size="13" fill="#18181b" text-anchor="end" font-weight="400" font-family="'SF Mono', Menlo, Consolas, monospace">time</text><rect x="170" y="268" width="10.0" height="14" rx="2" fill="#e3e9ee"/><text x="188.01" y="279" font-size="11.5" fill="#71717a" text-anchor="start" font-weight="400" font-family="'SF Mono', Menlo, Consolas, monospace">0.0091</text><text x="158" y="303" font-size="13" fill="#18181b" text-anchor="end" font-weight="400" font-family="'SF Mono', Menlo, Consolas, monospace">in</text><rect x="170" y="292" width="8.9" height="14" rx="2" fill="#e3e9ee"/><text x="186.91" y="303" font-size="11.5" fill="#71717a" text-anchor="start" font-weight="400" font-family="'SF Mono', Menlo, Consolas, monospace">0.0081</text><path d="M606,76 h8 v64 h-8" fill="none" stroke="#3f7d4e" stroke-width="1.5"/><text x="624" y="106.0" font-size="12.5" fill="#3f7d4e" text-anchor="start" font-weight="600">Top-P</text><text x="624" y="123.0" font-size="11.5" fill="#71717a" text-anchor="start" font-weight="400">P = 0.4</text><path d="M92,76 h-8 v112 h8" fill="none" stroke="#b4532a" stroke-width="1.5"/><text x="24" y="130.0" font-size="12.5" fill="#b4532a" text-anchor="start" font-weight="600">Top-K</text><text x="24" y="147.0" font-size="11.5" fill="#71717a" text-anchor="start" font-weight="400">K = 5</text><rect x="24" y="331" width="14" height="12" rx="2" fill="#2f5574"/><text x="46" y="342" font-size="12" fill="#3f3f46" text-anchor="start" font-weight="400">Greedy：直接选概率最高的 “to”</text><text x="24" y="366" font-size="12" fill="#3f3f46" text-anchor="start" font-weight="400">Top-K：只在概率最高的 5 个里抽样。Top-P：取累积概率达到 0.4 的最小集合（这里是前 3 个）。</text><text x="24" y="390" font-size="12" fill="#3f3f46" text-anchor="start" font-weight="400">Temperature 在抽样前调整分布：T 越小越集中（趋近 greedy），T 越大越平坦。</text>
</svg>