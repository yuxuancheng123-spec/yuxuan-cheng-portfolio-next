<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" role="img" aria-label="Roofline 模型：decode 受带宽限制，prefill 受算力限制" font-family="PingFang SC, 'Noto Sans SC', 'Noto Sans CJK SC', Inter, system-ui, sans-serif">
<title>Roofline 模型：decode 受带宽限制，prefill 受算力限制</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#71717a"/></marker>
<marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f5574"/></marker></defs>
<rect width="720" height="330" fill="#ffffff"/>
<line x1="80" y1="280" x2="640" y2="280" stroke="#71717a" stroke-width="1.3" marker-end="url(#ar)"/><line x1="80" y1="280" x2="80" y2="50" stroke="#71717a" stroke-width="1.3" marker-end="url(#ar)"/><text x="640" y="302" font-size="11.5" fill="#71717a" text-anchor="end" font-weight="400">计算强度 Arithmetic intensity（FLOPs / Byte）</text><text x="66" y="165.0" font-size="11.5" fill="#71717a" text-anchor="middle" transform="rotate(-90 66 165.0)">可达性能（FLOPs / s）</text><polygon points="80,280 360,90 360,280" fill="#eef2f5"/><line x1="80" y1="280" x2="360" y2="90" stroke="#2f5574" stroke-width="2.4"/><line x1="360" y1="90" x2="630" y2="90" stroke="#2f5574" stroke-width="2.4"/><line x1="360" y1="90" x2="360" y2="280" stroke="#e4ded3" stroke-width="1" stroke-dasharray="4 3"/><text x="372" y="80" font-size="12" fill="#2f5574" text-anchor="start" font-weight="600">峰值算力（平顶）</text><text x="150" y="178" font-size="12" fill="#2f5574" text-anchor="start" font-weight="600">带宽 × 强度（斜坡）</text><text x="200" y="320" font-size="12" fill="#3f3f46" text-anchor="middle" font-weight="600">带宽受限 memory-bound</text><text x="490" y="320" font-size="12" fill="#3f3f46" text-anchor="middle" font-weight="600">算力受限 compute-bound</text><circle cx="160" cy="226" r="6" fill="#b4532a"/><text x="172" y="244" font-size="12" fill="#b4532a" text-anchor="start" font-weight="600">Decode（小 batch）</text><circle cx="500" cy="90" r="6" fill="#3f7d4e"/><text x="500" y="114" font-size="12" fill="#3f7d4e" text-anchor="middle" font-weight="600">Prefill</text><text x="640" y="40" font-size="12.5" fill="#18181b" text-anchor="end" font-weight="600">Performance ≤ min(峰值算力, 带宽 × 强度)</text>
</svg>