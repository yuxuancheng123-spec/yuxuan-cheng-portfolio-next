<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 598" width="720" height="598" role="img" aria-label="Decoder-only Transformer 的结构" font-family="PingFang SC, 'Noto Sans SC', 'Noto Sans CJK SC', Inter, system-ui, sans-serif">
<title>Decoder-only Transformer 的结构</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#71717a"/></marker>
<marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f5574"/></marker></defs>
<rect width="720" height="598" fill="#ffffff"/>
<rect x="170.0" y="20" width="260" height="34" rx="8" fill="#faf7f1" stroke="#e4ded3" stroke-width="1"/><text x="300" y="41.5" font-size="13" fill="#18181b" text-anchor="middle" font-weight="500">下一个 token 的概率分布</text><rect x="170.0" y="66" width="260" height="34" rx="8" fill="#faf7f1" stroke="#e4ded3" stroke-width="1"/><text x="300" y="87.5" font-size="13" fill="#18181b" text-anchor="middle" font-weight="500">Softmax</text><rect x="170.0" y="112" width="260" height="34" rx="8" fill="#faf7f1" stroke="#e4ded3" stroke-width="1"/><text x="300" y="133.5" font-size="13" fill="#18181b" text-anchor="middle" font-weight="500">LM head（投影到词表）</text><rect x="170.0" y="158" width="260" height="34" rx="8" fill="#faf7f1" stroke="#e4ded3" stroke-width="1"/><text x="300" y="179.5" font-size="13" fill="#18181b" text-anchor="middle" font-weight="500">Layer Norm</text><rect x="170.0" y="218" width="260" height="34" rx="8" fill="#faf7f1" stroke="#e4ded3" stroke-width="1"/><text x="300" y="239.5" font-size="13" fill="#18181b" text-anchor="middle" font-weight="500">⊕ 残差相加</text><rect x="170.0" y="264" width="260" height="34" rx="8" fill="#eef2f5" stroke="#2f5574" stroke-width="1"/><text x="300" y="285.5" font-size="13" fill="#2f5574" text-anchor="middle" font-weight="600">前馈网络 FFN</text><rect x="170.0" y="310" width="260" height="34" rx="8" fill="#faf7f1" stroke="#e4ded3" stroke-width="1"/><text x="300" y="331.5" font-size="13" fill="#18181b" text-anchor="middle" font-weight="500">Layer Norm</text><rect x="170.0" y="356" width="260" height="34" rx="8" fill="#faf7f1" stroke="#e4ded3" stroke-width="1"/><text x="300" y="377.5" font-size="13" fill="#18181b" text-anchor="middle" font-weight="500">⊕ 残差相加</text><rect x="170.0" y="402" width="260" height="34" rx="8" fill="#eef2f5" stroke="#2f5574" stroke-width="1"/><text x="300" y="423.5" font-size="13" fill="#2f5574" text-anchor="middle" font-weight="600">多头因果自注意力</text><rect x="170.0" y="448" width="260" height="34" rx="8" fill="#faf7f1" stroke="#e4ded3" stroke-width="1"/><text x="300" y="469.5" font-size="13" fill="#18181b" text-anchor="middle" font-weight="500">Layer Norm</text><rect x="170.0" y="494" width="260" height="34" rx="8" fill="#faf7f1" stroke="#e4ded3" stroke-width="1"/><text x="300" y="515.5" font-size="13" fill="#18181b" text-anchor="middle" font-weight="500">Embedding + 位置编码</text><rect x="170.0" y="548" width="58" height="28" rx="6" fill="#ffffff" stroke="#e4ded3" stroke-width="1"/><text x="199.0" y="567" font-size="12.5" fill="#18181b" text-anchor="middle" font-weight="400" font-family="'SF Mono', Menlo, Consolas, monospace">The</text><rect x="238.0" y="548" width="58" height="28" rx="6" fill="#ffffff" stroke="#e4ded3" stroke-width="1"/><text x="267.0" y="567" font-size="12.5" fill="#18181b" text-anchor="middle" font-weight="400" font-family="'SF Mono', Menlo, Consolas, monospace">class</text><rect x="306.0" y="548" width="58" height="28" rx="6" fill="#ffffff" stroke="#e4ded3" stroke-width="1"/><text x="335.0" y="567" font-size="12.5" fill="#18181b" text-anchor="middle" font-weight="400" font-family="'SF Mono', Menlo, Consolas, monospace">was</text><rect x="374.0" y="548" width="58" height="28" rx="6" fill="#ffffff" stroke="#e4ded3" stroke-width="1"/><text x="403.0" y="567" font-size="12.5" fill="#18181b" text-anchor="middle" font-weight="400" font-family="'SF Mono', Menlo, Consolas, monospace">about</text><line x1="300" y1="548" x2="300" y2="530" stroke="#71717a" stroke-width="1.3" marker-end="url(#ar)"/><line x1="300" y1="494" x2="300" y2="484" stroke="#71717a" stroke-width="1.3" marker-end="url(#ar)"/><line x1="300" y1="448" x2="300" y2="438" stroke="#71717a" stroke-width="1.3" marker-end="url(#ar)"/><line x1="300" y1="402" x2="300" y2="392" stroke="#71717a" stroke-width="1.3" marker-end="url(#ar)"/><line x1="300" y1="356" x2="300" y2="346" stroke="#71717a" stroke-width="1.3" marker-end="url(#ar)"/><line x1="300" y1="310" x2="300" y2="300" stroke="#71717a" stroke-width="1.3" marker-end="url(#ar)"/><line x1="300" y1="264" x2="300" y2="254" stroke="#71717a" stroke-width="1.3" marker-end="url(#ar)"/><line x1="300" y1="218" x2="300" y2="194" stroke="#71717a" stroke-width="1.3" marker-end="url(#ar)"/><line x1="300" y1="158" x2="300" y2="148" stroke="#71717a" stroke-width="1.3" marker-end="url(#ar)"/><line x1="300" y1="112" x2="300" y2="102" stroke="#71717a" stroke-width="1.3" marker-end="url(#ar)"/><line x1="300" y1="66" x2="300" y2="56" stroke="#71717a" stroke-width="1.3" marker-end="url(#ar)"/><rect x="136.0" y="206" width="328" height="288" rx="12" fill="none" stroke="#2f5574" stroke-width="1.2" stroke-dasharray="5 4"/><text x="146.0" y="224" font-size="11.5" fill="#2f5574" text-anchor="start" font-weight="600">Transformer block</text><text x="454.0" y="224" font-size="12" fill="#2f5574" text-anchor="end" font-weight="600">× N 层</text><path d="M300,488 H446.0 V373 H432.0" fill="none" stroke="#71717a" stroke-width="1.2" marker-end="url(#ar)"/><path d="M300,350 H446.0 V235 H432.0" fill="none" stroke="#71717a" stroke-width="1.2" marker-end="url(#ar)"/><text x="500" y="414" font-size="11.5" fill="#3f3f46" text-anchor="start" font-weight="400">每个 token 按相关性汇聚前文信息</text><text x="500" y="430" font-size="11.5" fill="#3f3f46" text-anchor="start" font-weight="400">因果掩码：只能看见左边的 token</text><text x="500" y="276" font-size="11.5" fill="#3f3f46" text-anchor="start" font-weight="400">对每个 token 的表示单独再加工</text><text x="500" y="368" font-size="11.5" fill="#3f3f46" text-anchor="start" font-weight="400">残差：把子层的输入加回输出</text><text x="500" y="460" font-size="11.5" fill="#3f3f46" text-anchor="start" font-weight="400">课件中的结构是 pre-norm：</text><text x="500" y="476" font-size="11.5" fill="#3f3f46" text-anchor="start" font-weight="400">每个子层之前先做 Layer Norm</text>
</svg>