<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img" aria-label="训练的三个阶段与预训练数据处理" font-family="PingFang SC, 'Noto Sans SC', 'Noto Sans CJK SC', Inter, system-ui, sans-serif">
<title>训练的三个阶段与预训练数据处理</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#71717a"/></marker>
<marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f5574"/></marker></defs>
<rect width="720" height="300" fill="#ffffff"/>
<rect x="20" y="20" width="208" height="150" rx="10" fill="#faf7f1" stroke="#e4ded3" stroke-width="1"/><text x="36" y="46" font-size="15" fill="#18181b" text-anchor="start" font-weight="600">预训练</text><text x="89.0" y="46" font-size="11.5" fill="#71717a" text-anchor="start" font-weight="400">Pretraining</text><text x="36" y="78" font-size="12.5" fill="#3f3f46" text-anchor="start" font-weight="400">· 海量网页、代码、书籍</text><text x="36" y="102" font-size="12.5" fill="#3f3f46" text-anchor="start" font-weight="400">· next-token prediction</text><text x="36" y="126" font-size="12.5" fill="#3f3f46" text-anchor="start" font-weight="400">· 学语言规律与知识</text><line x1="232" y1="95" x2="252" y2="95" stroke="#71717a" stroke-width="1.3" marker-end="url(#ar)"/><rect x="256" y="20" width="208" height="150" rx="10" fill="#faf7f1" stroke="#e4ded3" stroke-width="1"/><text x="272" y="46" font-size="15" fill="#18181b" text-anchor="start" font-weight="600">中期训练</text><text x="340.0" y="46" font-size="11.5" fill="#71717a" text-anchor="start" font-weight="400">Midtraining</text><text x="272" y="78" font-size="12.5" fill="#3f3f46" text-anchor="start" font-weight="400">· 调整数据配比</text><text x="272" y="102" font-size="12.5" fill="#3f3f46" text-anchor="start" font-weight="400">· 加入更多目标领域数据</text><text x="272" y="126" font-size="12.5" fill="#3f3f46" text-anchor="start" font-weight="400">· 减少后续微调的遗忘</text><line x1="468" y1="95" x2="488" y2="95" stroke="#71717a" stroke-width="1.3" marker-end="url(#ar)"/><rect x="492" y="20" width="208" height="150" rx="10" fill="#eef2f5" stroke="#2f5574" stroke-width="1"/><text x="508" y="46" font-size="15" fill="#18181b" text-anchor="start" font-weight="600">后训练</text><text x="561.0" y="46" font-size="11.5" fill="#71717a" text-anchor="start" font-weight="400">Posttraining</text><text x="508" y="78" font-size="12.5" fill="#3f3f46" text-anchor="start" font-weight="400">· 指令微调 SFT / CoT</text><text x="508" y="102" font-size="12.5" fill="#3f3f46" text-anchor="start" font-weight="400">· RLHF：学人类偏好</text><text x="508" y="126" font-size="12.5" fill="#3f3f46" text-anchor="start" font-weight="400">· RLVR、agent 环境训练</text><text x="20" y="206" font-size="13" fill="#18181b" text-anchor="start" font-weight="600">预训练的数据处理</text><rect x="20" y="220" width="74.0" height="30" rx="6" fill="#ffffff" stroke="#e4ded3" stroke-width="1"/><text x="57.0" y="240" font-size="12.5" fill="#3f3f46" text-anchor="middle" font-weight="400">文本提取</text><line x1="96.0" y1="235" x2="110.0" y2="235" stroke="#71717a" stroke-width="1.3" marker-end="url(#ar)"/><rect x="112.0" y="220" width="74.0" height="30" rx="6" fill="#ffffff" stroke="#e4ded3" stroke-width="1"/><text x="149.0" y="240" font-size="12.5" fill="#3f3f46" text-anchor="middle" font-weight="400">语言识别</text><line x1="188.0" y1="235" x2="202.0" y2="235" stroke="#71717a" stroke-width="1.3" marker-end="url(#ar)"/><rect x="204.0" y="220" width="74.0" height="30" rx="6" fill="#ffffff" stroke="#e4ded3" stroke-width="1"/><text x="241.0" y="240" font-size="12.5" fill="#3f3f46" text-anchor="middle" font-weight="400">规则过滤</text><line x1="280.0" y1="235" x2="294.0" y2="235" stroke="#71717a" stroke-width="1.3" marker-end="url(#ar)"/><rect x="296.0" y="220" width="74.0" height="30" rx="6" fill="#ffffff" stroke="#e4ded3" stroke-width="1"/><text x="333.0" y="240" font-size="12.5" fill="#3f3f46" text-anchor="middle" font-weight="400">质量过滤</text><line x1="372.0" y1="235" x2="386.0" y2="235" stroke="#71717a" stroke-width="1.3" marker-end="url(#ar)"/><rect x="388.0" y="220" width="49.0" height="30" rx="6" fill="#ffffff" stroke="#e4ded3" stroke-width="1"/><text x="412.5" y="240" font-size="12.5" fill="#3f3f46" text-anchor="middle" font-weight="400">去重</text><line x1="439.0" y1="235" x2="453.0" y2="235" stroke="#71717a" stroke-width="1.3" marker-end="url(#ar)"/><rect x="455.0" y="220" width="74.0" height="30" rx="6" fill="#ffffff" stroke="#e4ded3" stroke-width="1"/><text x="492.0" y="240" font-size="12.5" fill="#3f3f46" text-anchor="middle" font-weight="400">模型过滤</text><text x="20" y="282" font-size="12" fill="#2f5574" text-anchor="start" font-weight="400">之后决定数据配比：swarm（代理模型试多组比例）→ 回归（预测比例与表现的关系）→ 优化（选出最佳比例）</text>
</svg>