<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 364" width="720" height="364" role="img" aria-label="上下文工程：按需拼装上下文，在末尾追加" font-family="PingFang SC, 'Noto Sans SC', 'Noto Sans CJK SC', Inter, system-ui, sans-serif">
<title>上下文工程：按需拼装上下文，在末尾追加</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#71717a"/></marker>
<marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f5574"/></marker></defs>
<rect width="720" height="364" fill="#ffffff"/>
<text x="24" y="28" font-size="12.5" fill="#18181b" text-anchor="start" font-weight="600">每次调用模型时，上下文从这些来源拼出来</text><rect x="24" y="44" width="150" height="30" rx="6" fill="#faf7f1" stroke="#e4ded3" stroke-width="1"/><text x="99" y="64" font-size="12.5" fill="#3f3f46" text-anchor="middle" font-weight="400">System prompt</text><line x1="176" y1="59" x2="256" y2="134" stroke="#71717a" stroke-width="1.3" marker-end="url(#ar)"/><rect x="24" y="84" width="150" height="30" rx="6" fill="#faf7f1" stroke="#e4ded3" stroke-width="1"/><text x="99" y="104" font-size="12.5" fill="#3f3f46" text-anchor="middle" font-weight="400">对话历史</text><line x1="176" y1="99" x2="256" y2="134" stroke="#71717a" stroke-width="1.3" marker-end="url(#ar)"/><rect x="24" y="124" width="150" height="30" rx="6" fill="#faf7f1" stroke="#e4ded3" stroke-width="1"/><text x="99" y="144" font-size="12.5" fill="#3f3f46" text-anchor="middle" font-weight="400">记忆</text><line x1="176" y1="139" x2="256" y2="134" stroke="#71717a" stroke-width="1.3" marker-end="url(#ar)"/><rect x="24" y="164" width="150" height="30" rx="6" fill="#faf7f1" stroke="#e4ded3" stroke-width="1"/><text x="99" y="184" font-size="12.5" fill="#3f3f46" text-anchor="middle" font-weight="400">工具调用结果</text><line x1="176" y1="179" x2="256" y2="134" stroke="#71717a" stroke-width="1.3" marker-end="url(#ar)"/><rect x="24" y="204" width="150" height="30" rx="6" fill="#faf7f1" stroke="#e4ded3" stroke-width="1"/><text x="99" y="224" font-size="12.5" fill="#3f3f46" text-anchor="middle" font-weight="400">附件</text><line x1="176" y1="219" x2="256" y2="134" stroke="#71717a" stroke-width="1.3" marker-end="url(#ar)"/><rect x="260" y="104" width="170" height="60" rx="10" fill="#eef2f5" stroke="#2f5574" stroke-width="1"/><text x="345" y="130" font-size="13" fill="#2f5574" text-anchor="middle" font-weight="600">上下文窗口</text><text x="345" y="149" font-size="11" fill="#2f5574" text-anchor="middle" font-weight="400">只放当前任务需要的</text><line x1="432" y1="134" x2="476" y2="134" stroke="#71717a" stroke-width="1.3" marker-end="url(#ar)"/><rect x="480" y="112" width="90" height="44" rx="10" fill="#18181b" stroke="#18181b" stroke-width="1"/><text x="525" y="139" font-size="14" fill="#fff" text-anchor="middle" font-weight="700">LLM</text><rect x="600" y="44" width="104" height="64" rx="8" fill="#ffffff" stroke="#e4ded3" stroke-width="1" stroke-dasharray="4 3"/><text x="652" y="70" font-size="12" fill="#18181b" text-anchor="middle" font-weight="600">外部存储</text><text x="652" y="88" font-size="10.5" fill="#71717a" text-anchor="middle" font-weight="400">原文、页码、记忆</text><path d="M600,90 C540,95 470,100 432,118" fill="none" stroke="#2f5574" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#ara)"/><text x="520" y="104" font-size="11" fill="#2f5574" text-anchor="end" font-weight="600">按需检索</text><text x="24" y="278" font-size="12.5" fill="#18181b" text-anchor="start" font-weight="600">在末尾追加，已缓存的前缀保持不变</text><rect x="24" y="292" width="150" height="30" rx="4" fill="#d5dee6" stroke="#c9d5df" stroke-width="1"/><text x="99.0" y="312" font-size="12" fill="#2f5574" text-anchor="middle" font-weight="400">System prompt</text><rect x="178" y="292" width="220" height="30" rx="4" fill="#d5dee6" stroke="#c9d5df" stroke-width="1"/><text x="288.0" y="312" font-size="12" fill="#2f5574" text-anchor="middle" font-weight="400">历史消息</text><rect x="402" y="292" width="120" height="30" rx="4" fill="#eef2f5" stroke="#2f5574" stroke-width="1"/><text x="462.0" y="312" font-size="12" fill="#2f5574" text-anchor="middle" font-weight="400">新内容</text><path d="M24,330 v6 H394 v-6" fill="none" stroke="#71717a" stroke-width="1.1"/><text x="209" y="352" font-size="11.5" fill="#71717a" text-anchor="middle" font-weight="400">KV cache 可复用</text><text x="536" y="312" font-size="11.5" fill="#2f5574" text-anchor="start" font-weight="600">← 只需为这部分做 prefill</text>
</svg>