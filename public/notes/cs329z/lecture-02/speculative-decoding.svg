<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img" aria-label="推测式解码：草稿模型猜测，目标模型批量验证" font-family="PingFang SC, 'Noto Sans SC', 'Noto Sans CJK SC', Inter, system-ui, sans-serif">
